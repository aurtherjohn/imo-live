# The Flutter template default here is -Xmx8G -XX:MaxMetaspaceSize=4G, which
# assumes a machine with far more than 7 GB of RAM. On this hardware the Gradle
# daemon dies during release builds with:
#   "There is insufficient memory for the Java Runtime Environment to continue.
#    Native memory allocation (mmap) failed to map 1824522240 bytes."
# These values are sized for a 7 GB machine and are ample for this project.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Limit parallel workers so the Gradle daemon, Kotlin daemon and R8 do not
# compete for the same limited physical memory.
#
# 2026-09-27: lowered 2 -> 1. This machine's sandbox interceptor denies writes
# from Gradle's *worker* processes (D8 dexing, AAPT2 resource compilation) on an
# intermittent, one-random-path-per-run basis, e.g.
#   ...\build\record_android\.transforms\...\BluetoothReceiver.dex  (run 1)
#   ...\build\firebase_auth\...\values-zh-rTW_values-zh-rTW.arsc.flat (run 2)
# Serialising to a single worker removes concurrent writers and the associated
# race. Slower, but the build gets to the end.
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
