name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The release build needs ~5.6 GB of transient space (Gradle caches,
      # Flutter build dirs). Freeing disk BEFORE the JDK/Flutter SDKs are
      # installed gives the whole pipeline more headroom. The preinstalled
      # Android SDK is deliberately kept — removing it only makes AGP
      # re-download the components again.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/dotnet*
          sudo rm -rf /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Must match the toolchain used locally (Flutter 3.47.3 / Dart 3.13.3):
      # pubspec.yaml requires Dart ^3.13.3, so anything older fails at
      # `flutter pub get` with an SDK-constraint error.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run flutter analyze
        run: flutter analyze

      # `flutter test` is deliberately NOT run here yet: the suite currently
      # hangs locally (one run stalled for over an hour with no failing test
      # reported), and a hanging step would burn the runner until the job
      # timeout. `flutter analyze` above already compiles the whole package and
      # fails the build on any compile-time error. Re-enable tests once the
      # hanging test is identified and fixed locally.

      # android/app/build.gradle.kts has NO debug-signing fallback on purpose —
      # a release build without real credentials fails ~20 minutes into Gradle.
      # This step fails fast instead, and decodes the keystore that Gradle's
      # `assertReleaseSigning` task will consume via the env vars below.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then
              echo "::error::Secret '$s' is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Release signing secrets are required — the Gradle build deliberately refuses to produce a debug-signed release APK."
            exit 1
          fi
          # Strip every whitespace char first — copy/paste into the secret
          # often wraps lines or sneaks in stray spaces that GNU base64
          # rejects as "invalid input". The expected value is the exact
          # contents of D:\keys\keystore.base64.txt (3040 chars, no spaces).
          clean="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$clean" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 could not be decoded (length after cleanup: ${#clean}, expected 3040). Re-copy the file exactly: Get-Content D:\\keys\\keystore.base64.txt -Raw | Set-Clipboard, then paste into the secret."
            exit 1
          fi
          # JKS keystores always start with the magic bytes FE ED FE ED — this
          # catches a secret that decodes but holds the wrong content.
          if [ "$(head -c 4 "$GITHUB_WORKSPACE/upload-keystore.jks" | od -An -tx1 | tr -d ' \n')" != "feedfeed" ]; then
            echo "::error::KEYSTORE_BASE64 decoded, but the file is not a JKS keystore (magic bytes do not match). The secret holds the wrong text."
            exit 1
          fi
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"

      # KEYSTORE_FILE must be ABSOLUTE (build.gradle.kts asserts that), and
      # $GITHUB_WORKSPACE always is.
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
