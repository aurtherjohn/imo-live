name: Build Flutter APK

on:
  push:
    branches: [ main ]
    # An APK build here is ~19 minutes and publishes a Release. A commit that
    # only touches documentation or project memory cannot change the APK, so it
    # does not need one — the previous release already carries the current code.
    #
    # ⚠️ `paths-ignore` skips the run only when **every** changed file matches,
    # so a commit that touches `lib/` alongside a `.md` still builds. That is
    # what makes this safe rather than a way to accidentally stop shipping.
    paths-ignore:
      - '**.md'
      - '.workbuddy-ai/**'
  # Manual runs ignore `paths-ignore` entirely, so a build can always be forced.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Flutter version check
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      # GOOGLE_OAUTH_CLIENT_ID is a build-time dart-define, not a runtime value:
      # it is read by `String.fromEnvironment` in `in_app_oauth_service.dart` and
      # baked into the APK. Without it the WebView fallback throws
      # "Google sign-in needs a client id", which is exactly the error this
      # step exists to prevent. The value lives in the repo secret of the same
      # name, so no client id is committed here.
      - name: Build APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imo-live-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Imo LIVE Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}